<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>codegraph — code city</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="city"></canvas>
    <header id="app-header" hidden>
      <h1 id="corpus-name"></h1>
      <nav id="header-toggles">
        <label><input type="checkbox" id="toggle-buildings" checked /> Show buildings</label>
        <label><input type="checkbox" id="toggle-fan-in" checked /> Show fan-in</label>
        <label><input type="checkbox" id="toggle-fan-out" checked /> Show fan-out</label>
        <label><input type="checkbox" id="toggle-all-deps" /> Show all dependencies</label>
      </nav>
      <button id="help-link" type="button">Help</button>
    </header>
    <aside id="tooltip" class="panel" hidden></aside>
    <aside id="details" class="panel" hidden>
      <button id="details-close" type="button" aria-label="Close">&times;</button>
      <div id="details-body"></div>
    </aside>
    <dialog id="help">
      <div id="help-body"></div>
      <form method="dialog"><button>Close</button></form>
    </dialog>
    <div id="loader">
      <h1>codegraph — code city</h1>
      <p id="loader-message">
        Drop a <code>city.json</code> here, or pick one. Produce it with<br />
        <code>codegraph city model.jsonl --layout --out city.json</code>
      </p>
      <p><input type="file" id="loader-file" accept=".json,application/json" /></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
