[package]
name = "codegraph-python-stdlib-table"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

# Standalone: the extractor embeds this tool's OUTPUT and never links it.
[workspace]

# The extractor's own parser, at the extractor's own tag: the table is read
# with the grammar the corpus is read with, and no second parser is needed.
[dependencies]
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.17.6" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.17.6" }
