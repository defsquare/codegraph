[package]
name = "codegraph-python"
description = "Extracts a codegraph model.jsonl from Python sources: Ruff's parser as a library, no Python on the machine"
version = "0.3.0"
edition = "2024"
# The pinned Ruff tag's own floor (its workspace `rust-version`): a bump of the
# tag may raise it, and cargo then says why an older toolchain fails.
rust-version = "1.98"
license = "MIT"
publish = false

# Standalone: never adopted by a workspace above it. `tools/stdlib-table` is its
# own package for the same reason — the extractor links no generator.
[workspace]

[lib]
name = "codegraph_python"
path = "src/lib.rs"

[[bin]]
name = "codegraph-python"
path = "src/main.rs"

[dependencies]
# The model.jsonl writer every Rust extractor shares: keys, canonical order,
# core's bytes. A path dependency, built by this package's release profile.
codegraph-model = { path = "../model-rs" }
# Ruff's parser is published nowhere: a git dependency, the three crates at ONE
# tag, the commit held by Cargo.lock and every build --locked. The parser IS
# the front end, so a bump is a deliberate, reviewed change that regenerates
# the fixture snapshot (`RUFF_TAG` in src/lib.rs is pinned to these lines by a
# test). `stacker` grows the parser's stack on deep nesting (it needs a C
# compiler to build, `psm`).
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.17.6" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.17.6", features = ["stacker"] }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.17.6" }
# The parser's own stack-growth crate, at the version the parser already
# links: the walk over a tree recurses as the parser does, so it grows its
# stack the same way (a module of one 100 000-term expression is a test).
stacker = "=0.1.25"

[profile.release]
codegen-units = 1
lto = true
strip = true
