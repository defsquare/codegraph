image: node:22

stages: [check]

variables:
  PNPM_HOME: "$CI_PROJECT_DIR/.pnpm-store"

cache:
  key:
    files: [pnpm-lock.yaml]
  paths: [.pnpm-store]

verify:
  stage: check
  before_script:
    - corepack enable pnpm
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm -r build
    - pnpm -r typecheck
    - pnpm -r test
    # schemas/ is a committed artifact: regenerating must be a no-op.
    - pnpm run gen:schemas
    - git diff --exit-code schemas/ || (echo "schemas/ is stale — run pnpm run gen:schemas and commit" && exit 1)

# The two websites — the landing page and the documentation (Hugo + Hextra,
# a git submodule) — built with the same pinned Hugo version a developer runs
# locally. Independent of the Node toolchain.
website:
  stage: check
  image: hugomods/hugo:exts-0.165.0
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_DEPTH: 1
  script:
    - cd website/landing && hugo --minify --gc
    - cd ../doc && hugo --minify --gc
  artifacts:
    paths: [website/landing/public, website/doc/public]
    expire_in: 1 week
