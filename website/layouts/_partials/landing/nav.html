<header class="content">
  <nav class="nav" aria-label="Site">
    {{/* The wordmark IS the logo, so the image carries the link's accessible
         name — no separate text mark. Intrinsic size is the SVG's own 242×49;
         the displayed height is set in CSS, on the type scale. */}}
    <a class="nav__mark" href="{{ "" | relURL }}">
      <img src="{{ "img/codegraph-logo-long-dark-blue-text-red-brackets.svg" | relURL }}"
           width="242" height="49" alt="codegraph">
    </a>
    <div class="nav__links">
      {{ range site.Params.nav }}
        <a href="{{ partial "landing/link.html" . }}">{{ .name }}</a>
      {{ end }}
    </div>
  </nav>
</header>
