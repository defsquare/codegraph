# Codegraph website — Hugo + Hextra (vendored at themes/hextra as a git submodule).
baseURL: "https://codegraph.dev/doc/"
title: "Codegraph"
theme: hextra
# The docs live under /doc/ and every content link is site-absolute
# (/tutorials/…): canonify rewrites them to the baseURL at render time.
canonifyURLs: true
enableRobotsTXT: true
enableGitInfo: true
enableInlineShortcodes: true

module:
  hugoVersion:
    extended: true
    min: "0.146.0"

outputs:
  home: [html, llms]
  page: [html, markdown]
  section: [html, rss, markdown]

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

menu:
  main:
    - identifier: tutorials
      name: Tutorials
      pageRef: /tutorials
      weight: 1
    - identifier: how-to
      name: How-to
      pageRef: /how-to
      weight: 2
    - identifier: reference
      name: Reference
      pageRef: /reference
      weight: 3
    - identifier: explanation
      name: Explanation
      pageRef: /explanation
      weight: 4
    - name: Search
      weight: 8
      params:
        type: search
    - name: Landing page
      weight: 7
      url: "https://codegraph.dev/"
    - name: GitLab
      weight: 9
      url: "https://gitlab.com/jgrodziski/codegraph"
      params:
        icon: gitlab

params:
  description: "See the structure of a codebase you did not write — even one that no longer compiles."
  externalLinkDecoration: true
  navbar:
    displayTitle: true
    displayLogo: false
    width: wide
  theme:
    default: system
    displayToggle: true
  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: false
    width: normal
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
  editURL:
    enable: true
    base: "https://gitlab.com/jgrodziski/codegraph/-/edit/main/website/content"
  highlight:
    copy:
      enable: true
      display: hover
  page:
    width: normal
