# Codegraph landing page — Hugo, no theme. One page, built from
# content/_index.md (the intro) and content/sections/*.md (the essay rows).
# The documentation site is a separate Hugo site at ../doc, deployed under
# params.docsBase.
baseURL: "https://codegraph.dev/"
title: "Codegraph"
enableRobotsTXT: true

# A one-page site: no taxonomies, no feed.
disableKinds: [taxonomy, term, rss]

markup:
  goldmark:
    renderer:
      unsafe: true   # the copy carries a few inline spans (the red caption word)
  highlight:
    # No syntax colouring on this page: the design system gives code one
    # colour on near-black, and a rainbow would be decoration.
    codeFences: false

params:
  description: "Codegraph extracts a dependency model from sources alone, with no build, and lets you query it, walk it as a 3D city, browse every dependency to its source line, replay its history, and have it explained bottom-up."

  # Where the documentation site is deployed. Every documentation link on this
  # page is built from it, so moving the docs is a one-line change.
  docsBase: "/doc/"

  nav:
    - name: "Tutorials"
      doc: "tutorials/"
    - name: "Documentation"
      doc: ""
    - name: "Source"
      url: "https://gitlab.com/jgrodziski/codegraph"

  footer:
    about:
      logo: "img/defsquare-long-white-red.svg"
      alt: "Defsquare"
      text: >-
        Codegraph is designed, built and run by Defsquare, a software studio that designs,
        builds and runs software systems in complex environments. The metamodel follows FamixNG,
        the city follows CodeCity, and the history analyses follow Gource and Adam Tornhill's work.
    columns:
      - heading: "Documentation"
        links:
          - name: "Tutorials"
            doc: "tutorials/"
          - name: "How-to guides"
            doc: "how-to/"
          - name: "Reference"
            doc: "reference/"
          - name: "Explanation"
            doc: "explanation/"
      - heading: "Project"
        links:
          - name: "Source on GitLab"
            url: "https://gitlab.com/jgrodziski/codegraph"
          - name: "Prior art and credits"
            doc: "explanation/prior-art/"
          - name: "Design decisions"
            doc: "explanation/decisions/"
          - name: "License: not yet chosen. Until a LICENSE file lands, all rights reserved."
    studio:
      name: "Defsquare"
      url: "https://defsquare.com"
